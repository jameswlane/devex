# Plugin Metadata for the Mac App Store (mas) Package Manager
name: package-manager-mas
type: package-manager
description: Mac App Store app installer for macOS, using the mas command-line tool
version: 0.1.0
author: DevEx Team
license: MIT
# Repository Information
repository: https://github.com/jameswlane/devex
directory: packages/package-manager-mas
# Platform Support
platforms:
  darwin:
    distros: [] # macOS doesn't have distros
    architectures:
      - amd64
      - arm64
    min_version: "10.15" # macOS Catalina
# SDK Compatibility
sdk_version: "1.0.0"
api_version: "v1"
# Dependencies & Conflicts
dependencies: []
conflicts: []
# Capabilities
supports:
  install: true
  uninstall: true
  update: false # The App Store has no local index to refresh; use upgrade
  upgrade: true
  search: true
  list: true
# Priority (lower number = higher priority)
priority: 20
# Tags for discovery
tags:
  - package-manager
  - mas
  - app-store
  - macos
  - darwin
