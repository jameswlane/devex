# Plugin Metadata for the Windows Package Manager (winget)
name: package-manager-winget
type: package-manager
description: Windows Package Manager (winget) installer for Windows 10 and 11
version: 0.1.0
author: DevEx Team
license: MIT
# Repository Information
repository: https://github.com/jameswlane/devex
directory: packages/package-manager-winget
# Platform Support
platforms:
  windows:
    distros: [] # Windows doesn't have distros
    architectures:
      - amd64
      - arm64
    min_version: "10.0.17763" # Windows 10 1809, the first release winget supports
# SDK Compatibility
sdk_version: "1.0.0"
api_version: "v1"
# Dependencies & Conflicts
dependencies: []
conflicts: []
# Capabilities
supports:
  install: true
  uninstall: true
  update: true # winget source update refreshes metadata only
  upgrade: true
  search: true
  list: true
# Priority (lower number = higher priority)
priority: 10
# Tags for discovery
tags:
  - package-manager
  - winget
  - windows
