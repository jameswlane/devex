version: '3'
vars:
  PLUGIN_NAME: devex-plugin-package-manager-winget
  BUILD_PLATFORMS: >-
    windows/amd64 windows/arm64
includes:
  plugin:
    taskfile: ../Taskfile.plugin.yml
    flatten: true
tasks:
  test:
    desc: Run tests
    cmds:
      - go test -v ./...
  lint:
    desc: Run linters
    cmds:
      - golangci-lint run
  install:local:
    vars:
      PLUGIN_DIR:
        sh: go -C ../plugin-sdk run ./cmd/plugin-path
    desc: Install plugin locally for testing
    cmds:
      - task: build
      - mkdir -p "{{.PLUGIN_DIR}}"
      # Windows runs plugins only with their .exe suffix.
      - cp dist/\{{.PLUGIN_NAME}}-\{{OS}}-\{{ARCH}}.exe "{{.PLUGIN_DIR}}"/\{{.PLUGIN_NAME}}.exe
  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf dist/
