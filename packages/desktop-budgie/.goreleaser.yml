# Code generated by scripts/release/generate-goreleaser.mjs. DO NOT EDIT.
# Targets come from packages/desktop-budgie/metadata.yaml; edit that file and run
#   pnpm release:generate
# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
version: 2
project_name: devex-plugin-desktop-budgie
monorepo:
  tag_prefix: packages/desktop-budgie/v
  dir: packages/desktop-budgie
metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
builds:
  - id: desktop-budgie
    main: .
    binary: devex-plugin-desktop-budgie
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
archives:
  # Archive for people downloading from GitHub; SDK v0.0.6+ extracts it.
  - id: archive
    ids: [desktop-budgie]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "devex-plugin-desktop-budgie_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README*
      - LICENSE*
  # Raw executable the registry points at; older CLIs install it without extracting.
  - id: binary
    ids: [desktop-budgie]
    formats: [binary]
    name_template: "devex-plugin-desktop-budgie_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: checksums.txt
  algorithm: sha256
signs:
  - id: cosign
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
  groups:
    - title: New Features
      regexp: '^.*?feat(\([[:word:]-]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]-]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
release:
  github:
    owner: jameswlane
    name: devex
  name_template: "devex-plugin-desktop-budgie v{{ .Version }}"
  # Only CLI releases may become GitHub's "Latest" release.
  make_latest: false
  prerelease: auto
  preflight:
    fail_on_error: true
verify:
  commands:
    - cmd: sha256sum
      args: ["--ignore-missing", "-c", "checksums.txt"]
    - cmd: cosign
      args:
        - verify-blob
        - --bundle=checksums.txt.sigstore.json
        - --certificate-identity-regexp=^https://github\.com/jameswlane/devex/\.github/workflows/
        - --certificate-oidc-issuer=https://token.actions.githubusercontent.com
        - checksums.txt
  retry:
    attempts: 5
    delay: 10s
