version: '3'
vars:
  PLUGIN_NAME: devex-plugin-desktop-budgie
tasks:
  build:
    desc: Build Budgie desktop plugin for all platforms
    cmds:
      - mkdir -p dist
      - |
        GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version={{.VERSION | default "dev"}}" \
          -o dist/{{.PLUGIN_NAME}}-linux-amd64 .
      - |
        GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version={{.VERSION | default "dev"}}" \
          -o dist/{{.PLUGIN_NAME}}-linux-arm64 .
  test:
    desc: Run tests
    cmds:
      - go test -v ./...
  lint:
    desc: Run linters
    cmds:
      - golangci-lint run
  install:local:
    vars:
      PLUGIN_DIR:
        sh: go -C ../plugin-sdk run ./cmd/plugin-path
    desc: Install plugin locally for testing
    cmds:
      - task: build
      - mkdir -p "{{.PLUGIN_DIR}}"
      - cp dist/{{.PLUGIN_NAME}}-linux-{{ARCH}} "{{.PLUGIN_DIR}}"/{{.PLUGIN_NAME}}
      - chmod +x "{{.PLUGIN_DIR}}"/{{.PLUGIN_NAME}}
  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf dist/
