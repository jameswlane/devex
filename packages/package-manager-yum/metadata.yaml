# Plugin Metadata for YUM Package Manager
name: package-manager-yum
type: package-manager
description: YUM package manager support for legacy RHEL/CentOS 7, with a DNF-compatible fallback on RHEL 8+
version: 1.0.0
author: DevEx Team
license: MIT
# Repository Information
repository: https://github.com/jameswlane/devex
directory: packages/package-manager-yum
# Platform Support
# RHEL/CentOS 7 use the native YUM 3 executable. RHEL 8+, CentOS Stream,
# Rocky Linux, AlmaLinux and Oracle Linux use the yum alias that DNF ships, or
# dnf directly when no yum executable is on PATH.
platforms:
  linux:
    distros:
      - rhel
      - centos
      - rocky
      - almalinux
      - oracle
    architectures:
      - amd64
      - arm64
    min_version: "7" # Minimum RHEL/CentOS version
# SDK Compatibility
sdk_version: "1.0.0"
api_version: "v1"
# Dependencies & Conflicts
dependencies: []
conflicts: []
# Capabilities
supports:
  install: true
  uninstall: true
  update: true
  search: true
  list: true
  repository_management: true
# Priority (lower number = higher priority)
priority: 95
# Tags for discovery
tags:
  - package-manager
  - yum
  - rhel
  - centos
  - linux
  - system
