version: '3'
vars:
  PLUGIN_NAME: devex-plugin-package-manager-pip
  BUILD_PLATFORMS: >-
    darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64
includes:
  plugin:
    taskfile: ../Taskfile.plugin.yml
    flatten: true
tasks:
  test:
    desc: Run tests
    cmds:
      - go test -v ./...
  lint:
    desc: Run linters
    cmds:
      - golangci-lint run
  install:local:
    desc: Install plugin locally for testing
    cmds:
      - task: build
      - mkdir -p ~/.devex/plugins
      - cp dist/\{{.PLUGIN_NAME}}-\{{OS}}-\{{ARCH}}* ~/.devex/plugins/\{{.PLUGIN_NAME}}
      - chmod +x ~/.devex/plugins/\{{.PLUGIN_NAME}}
  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf dist/
