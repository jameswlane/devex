name: Auggie CLI
description: Augment Code's terminal AI coding agent
category: AI Coding Agents
default: false
desktop_environments:
  - all
# Vendor docs: https://docs.augmentcode.com/cli/overview
# Source repo: https://github.com/augmentcode/auggie
macos:
  install_method: mise
  install_command: node@24 npm:@augmentcode/auggie@latest
  uninstall_command: npm:@augmentcode/auggie
  self_updating: false
  official_support: true
  dependencies:
    - Node.js
windows:
  install_method: mise
  install_command: node@24 npm:@augmentcode/auggie@latest
  uninstall_command: npm:@augmentcode/auggie
  self_updating: false
  official_support: true
  dependencies:
    - Node.js
linux:
  # mise installs npm:@augmentcode/auggie without sudo npm -g. Node is installed
  # in the same mise call because the npm backend needs it.
  # Not marked self_updating even though Auggie auto-updates by default in interactive mode
  # unless AUGMENT_DISABLE_AUTO_UPDATE=1 or autoUpdate=false is set.
  # Its updater runs a global npm install outside mise's prefix, so the mise
  # copy would stay stale; DevEx upgrades it through mise instead (#654).
  # Node 24, not node@lts: mise's lts is Node 26, whose Linux binaries need
  # libatomic.so.1, which fresh Debian/Ubuntu images lack (#703).
  install_method: mise
  install_command: node@24 npm:@augmentcode/auggie@latest
  uninstall_command: npm:@augmentcode/auggie
  self_updating: false
  official_support: true
  dependencies:
    - Node.js
