name: Ollama
description: Run large language models locally with a systemd service and GPU acceleration
category: Local Models
default: false
desktop_environments:
  - all
macos:
  install_method: brew
  install_command: ollama-app
  installed_binary: ollama
  uninstall_command: ollama-app
  brew_cask: true
  official_support: true
windows:
  install_method: winget
  install_command: Ollama.Ollama
  installed_binary: ollama
  uninstall_command: Ollama.Ollama
  official_support: true
linux:
  # Installs the official Linux release tarball directly into /usr/local and
  # configures a localhost-bound systemd service, avoiding Ollama's upstream
  # bootstrap script which installs CUDA drivers silently via apt/dnf.
  install_method: curlpipe
  # Absolute so a per-user mise ollama on PATH does not count as the system install.
  installed_binary: /usr/local/bin/ollama
  official_support: true
  dependencies:
    - curl
    - zstd
  post_install:
    - scope: system
      shell: |
        set -eu
        case "$(uname -m)" in
          x86_64|amd64) arch="amd64" ;;
          aarch64|arm64) arch="arm64" ;;
          *)
            echo "Unsupported architecture for Ollama Linux tarball: $(uname -m)" >&2
            exit 1
            ;;
        esac
        for tool in curl zstd; do
          command -v "$tool" >/dev/null 2>&1 || { echo "Ollama needs $tool to download and unpack its release archive: run 'devex install $tool' and retry." >&2; exit 1; }
        done
        # /var/tmp, not /tmp: the archives are ~1.6 GB and /tmp is often a small tmpfs.
        tmp="$(mktemp -d /var/tmp/devex-ollama.XXXXXX)"
        trap 'rm -rf "$tmp"' EXIT
        # Download fully before touching the existing install, so a failed or
        # truncated download never leaves a half-removed Ollama behind.
        curl -fsSL -o "$tmp/ollama.tar.zst" "https://ollama.com/download/ollama-linux-${arch}.tar.zst"
        zstd -t -q "$tmp/ollama.tar.zst"
        has_amd_gpu=0
        has_nvidia_gpu=0
        for dev in /sys/bus/pci/devices/*; do
          [ -r "$dev/vendor" ] && [ -r "$dev/class" ] || continue
          vendor="$(cat "$dev/vendor" 2>/dev/null || true)"
          class="$(cat "$dev/class" 2>/dev/null || true)"
          case "$class" in
            0x03*)
              case "$vendor" in
                0x1002) has_amd_gpu=1 ;;
                0x10de) has_nvidia_gpu=1 ;;
              esac
              ;;
          esac
        done
        if [ "$has_amd_gpu" -eq 1 ] && [ "$arch" = "amd64" ]; then
          curl -fsSL -o "$tmp/ollama-rocm.tar.zst" "https://ollama.com/download/ollama-linux-amd64-rocm.tar.zst"
          zstd -t -q "$tmp/ollama-rocm.tar.zst"
        fi
        rm -rf /usr/local/lib/ollama
        install -o0 -g0 -m755 -d /usr/local/lib/ollama
        zstd -d -q -c "$tmp/ollama.tar.zst" | tar -xf - -C /usr/local
        if [ -f "$tmp/ollama-rocm.tar.zst" ]; then
          zstd -d -q -c "$tmp/ollama-rocm.tar.zst" | tar -xf - -C /usr/local
        fi
        [ -x /usr/local/bin/ollama ] || { echo "Ollama archive did not provide /usr/local/bin/ollama" >&2; exit 1; }
        if ! id ollama >/dev/null 2>&1; then
          useradd -r -s /bin/false -U -m -d /usr/share/ollama ollama
        fi
        if getent group render >/dev/null 2>&1; then
          usermod -a -G render ollama
        fi
        if getent group video >/dev/null 2>&1; then
          usermod -a -G video ollama
        fi
        if [ -n "${DEVEX_INVOKING_USER:-}" ] && id "$DEVEX_INVOKING_USER" >/dev/null 2>&1; then
          usermod -a -G ollama "$DEVEX_INVOKING_USER"
        fi
        install -o0 -g0 -m755 -d /etc/systemd/system
        cat <<'EOF' > /etc/systemd/system/ollama.service
        [Unit]
        Description=Ollama Service
        After=network-online.target

        [Service]
        ExecStart=/usr/local/bin/ollama serve
        User=ollama
        Group=ollama
        Restart=always
        RestartSec=3
        Environment="OLLAMA_HOST=127.0.0.1:11434"

        [Install]
        WantedBy=default.target
        EOF
        chmod 0644 /etc/systemd/system/ollama.service
        if [ -d /run/systemd/system ]; then
          systemctl daemon-reload
          systemctl enable --now ollama
        else
          echo "Ollama service was not started: systemd is unavailable. Start Ollama manually with 'ollama serve'."
        fi
        if [ "$has_nvidia_gpu" -eq 1 ] && ! nvidia-smi >/dev/null 2>&1; then
          echo "NVIDIA GPU detected without a working driver (nvidia-smi missing or failing); Ollama will run on CPU until NVIDIA drivers are installed."
          echo "  Ubuntu: sudo ubuntu-drivers install"
          echo "  Debian: https://wiki.debian.org/NvidiaGraphicsDrivers"
        fi
  uninstall_command: |
    set -eu
    SUDO=""
    if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; fi
    if [ -d /run/systemd/system ]; then
      $SUDO systemctl stop ollama 2>/dev/null || true
      $SUDO systemctl disable ollama 2>/dev/null || true
    fi
    $SUDO rm -f /etc/systemd/system/ollama.service
    if [ -d /run/systemd/system ]; then
      $SUDO systemctl daemon-reload 2>/dev/null || true
    fi
    $SUDO rm -rf /usr/local/bin/ollama /usr/local/lib/ollama
    if [ "${DEVEX_UNINSTALL_KEEP_DATA:-}" = "1" ]; then
      # The ollama account owns the model store, so keep both for a reinstall.
      echo "Kept the ollama user and downloaded models in /usr/share/ollama (--keep-data)."
    else
      if id ollama >/dev/null 2>&1; then
        $SUDO userdel ollama || true
      fi
      if getent group ollama >/dev/null 2>&1; then
        $SUDO groupdel ollama || true
      fi
      $SUDO rm -rf /usr/share/ollama
    fi
