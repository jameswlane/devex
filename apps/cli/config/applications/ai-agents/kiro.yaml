# Upstream: https://kiro.dev (downloads: https://kiro.dev/downloads/ide/)
name: Kiro
description: Amazon's agentic IDE with spec-driven development (VS Code based)
category: AI Code Editors
default: false
desktop_environments:
  - graphical
linux:
  # Kiro publishes signed .deb packages but no apt repository. Pinned to
  # 1.4.154 and verified against the SHA-256 DevEx computed from the vendor
  # download. The package's postinst only registers an apt source when the
  # package is named `code`, so it adds none for `kiro`. Kiro needs Ubuntu
  # 24.04+ or Debian 13+, and downloads its own updates in the background.
  # Uninstall removes the package (postrm drops /usr/bin/kiro) and keeps
  # ~/.kiro and ~/.config/Kiro.
  install_method: deb
  install_command: kiro
  installed_binary: /usr/bin/kiro
  uninstall_command: kiro
  download_url: https://prod.download.desktop.kiro.dev/releases/stable/linux-x64/signed/1.4.154/deb/kiro-ide-1.4.154-stable-linux-x64.deb
  verification:
    sha256: 72c8aaa43e9fe70866486f5914c4a9db0574071ac0be75cc1217e3d3fa2493f6
  self_updating: true
  official_support: true
  # The catalog resolver falls back to the primary entry on older releases,
  # so refuse them here: Kiro needs Ubuntu 24.04+, Debian 13+ or Linux Mint 22+.
  pre_install:
    - scope: user
      shell: |
        set -eu
        ID=""; VERSION_ID=""
        . /etc/os-release
        major="${VERSION_ID%%.*}"
        # Debian testing and sid have no VERSION_ID; they are newer than 13.
        case "$ID" in
          ubuntu) [ "${major:-0}" -ge 24 ] || { echo "Kiro needs Ubuntu 24.04 or newer (this is ${VERSION_ID:-unknown})." >&2; exit 1; } ;;
          debian) [ "${major:-99}" -ge 13 ] || { echo "Kiro needs Debian 13 or newer (this is $VERSION_ID)." >&2; exit 1; } ;;
          linuxmint) [ "${major:-0}" -ge 22 ] || { echo "Kiro needs Linux Mint 22 or newer (this is ${VERSION_ID:-unknown})." >&2; exit 1; } ;;
        esac
  platform_requirements:
    - os: debian
      version: 13+
      arch: amd64
    - os: ubuntu
      version: 24.04+
      arch: amd64
  alternatives:
    - install_method: deb
      install_command: kiro
      installed_binary: /usr/bin/kiro
      uninstall_command: kiro
      download_url: https://prod.download.desktop.kiro.dev/releases/stable/linux-arm64/signed/1.4.154/deb/kiro-ide-1.4.154-stable-linux-arm64.deb
      verification:
        sha256: 75d39ed5b0988a41513d9462ecad60399a96552eff417c64e1c2f2649390e7a3
      self_updating: true
      official_support: true
      pre_install:
        - scope: user
          shell: |
            set -eu
            ID=""; VERSION_ID=""
            . /etc/os-release
            major="${VERSION_ID%%.*}"
            # Debian testing and sid have no VERSION_ID; they are newer than 13.
            case "$ID" in
              ubuntu) [ "${major:-0}" -ge 24 ] || { echo "Kiro needs Ubuntu 24.04 or newer (this is ${VERSION_ID:-unknown})." >&2; exit 1; } ;;
              debian) [ "${major:-99}" -ge 13 ] || { echo "Kiro needs Debian 13 or newer (this is $VERSION_ID)." >&2; exit 1; } ;;
              linuxmint) [ "${major:-0}" -ge 22 ] || { echo "Kiro needs Linux Mint 22 or newer (this is ${VERSION_ID:-unknown})." >&2; exit 1; } ;;
            esac
      platform_requirements:
        - os: debian
          version: 13+
          arch: arm64
        - os: ubuntu
          version: 24.04+
          arch: arm64
