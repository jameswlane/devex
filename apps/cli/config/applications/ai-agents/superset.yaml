# Upstream: https://github.com/ParadevAI/Paradev (formerly superset-sh/superset; https://paradev.com)
# Rebranded from Superset to Paradev; the Debian package and CLI command remain
# `superset`. Linux desktop releases are amd64 only; Windows is not yet available.
name: Superset
description: Cross-platform desktop workspace (now Paradev) for running parallel coding agents in isolated Git worktrees
category: AI Agent Harnesses
default: false
desktop_environments:
  - graphical
macos:
  install_method: brew
  install_command: paradev
  uninstall_command: paradev
  brew_cask: true
  self_updating: true
  official_support: true
  dependencies:
    - git
linux:
  # Official .deb release (Package: superset) provides its own .desktop entry
  # and icons; Electron auto-updates via latest-linux.yml. Only amd64 is built.
  install_method: deb
  install_command: superset
  installed_binary: /usr/bin/superset
  uninstall_command: superset
  download_url: https://github.com/ParadevAI/Paradev/releases/download/desktop-v2.0.12/paradev-2.0.12-amd64.deb
  verification:
    sha256: c768ab92e62d05bf6899348895ba6af5e5498acbfb3291e367b0b267e8756c1e
  self_updating: true
  official_support: true
  dependencies:
    - git
  platform_requirements:
    - os: debian
      arch: amd64
    - os: ubuntu
      arch: amd64
  alternatives:
    - install_method: appimage
      install_command: https://github.com/ParadevAI/Paradev/releases/download/desktop-v2.0.12/Paradev-x86_64.AppImage Paradev-x86_64.AppImage --gui
      installed_binary: Paradev-x86_64.AppImage
      uninstall_command: Paradev-x86_64.AppImage
      download_url: https://github.com/ParadevAI/Paradev/releases/download/desktop-v2.0.12/Paradev-x86_64.AppImage
      destination: ~/Applications/
      verification:
        sha256: 90eb8a1230c6e522cd7f2019815e4681a8c3f05e05a478a4709fd246004a6e4b
      self_updating: true
      official_support: true
      dependencies:
        - git
      platform_requirements:
        - os: linux
          arch: amd64
