# Upstream: https://github.com/mixpeek/amux (https://amux.io)
# Disambiguation: this is mixpeek/amux (Rust + SQLite web/mobile Kanban board
# and multi-agent control plane), not amux.sh or andyrewlee/amux.
name: amux
description: Self-hosted Rust + SQLite agent control plane with a shared Kanban task board, web dashboard, and mobile apps
category: AI Agent Harnesses
default: false
desktop_environments:
  - all
macos:
  # Upstream has no prebuilt CLI/server release binaries or Homebrew formula;
  # builds amux-server-rs and amux-rs from source into ~/.local/bin without
  # auto-loading launchd agents or editing other agents' settings files.
  install_method: curlpipe
  install_scope: user
  installed_binary: amux-server-rs
  self_updating: false
  official_support: true
  dependencies:
    - git
    - tmux
    - Rust
  post_install:
    - scope: user
      shell: |
        set -eu
        export PATH="$HOME/.local/share/mise/shims:$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
        for tool in git cargo tmux; do
          command -v "$tool" >/dev/null 2>&1 || { echo "amux needs $tool: run 'devex install $tool' and retry." >&2; exit 1; }
        done
        checkout="$HOME/.local/share/amux"
        bin_dir="$HOME/.local/bin"
        mkdir -p "$HOME/.local/share" "$bin_dir"
        if [ -d "$checkout/.git" ]; then
          git -C "$checkout" pull --ff-only
        else
          git clone --depth 1 https://github.com/mixpeek/amux.git "$checkout"
        fi
        tmp_target="$(mktemp -d /var/tmp/devex-amux-build.XXXXXX)"
        trap 'rm -rf "$tmp_target"' EXIT
        CARGO_TARGET_DIR="$tmp_target" CARGO_INCREMENTAL=0 cargo build --manifest-path "$checkout/Cargo.toml" --release -p amux-server -p amux-cli
        install -m 0755 "$tmp_target/release/amux-server" "$bin_dir/amux-server-rs"
        install -m 0755 "$tmp_target/release/amux-rs" "$bin_dir/amux-rs"
        if [ -f "$checkout/amux" ]; then
          install -m 0755 "$checkout/amux" "$bin_dir/amux"
        fi
        echo "amux built and installed to $bin_dir/amux-server-rs and $bin_dir/amux-rs."
        echo "Run bound to localhost with: AMUX_RS_BIND=127.0.0.1 AMUX_RS_PORT=8824 $bin_dir/amux-server-rs"
  uninstall_command: |
    set -eu
    rm -f "$HOME/.local/bin/amux-server-rs" "$HOME/.local/bin/amux-rs" "$HOME/.local/bin/amux"
    rm -rf "$HOME/.local/share/amux"
linux:
  # Upstream has no prebuilt Linux release binaries (only source checkout +
  # cargo build). DevEx builds into ~/.local/bin without mutating ~/.claude or
  # ~/.codex settings, and writes a disabled localhost-bound user systemd unit
  # (AMUX_RS_BIND=127.0.0.1; upstream's default binds 0.0.0.0).
  install_method: curlpipe
  install_scope: user
  installed_binary: amux-server-rs
  self_updating: false
  official_support: true
  dependencies:
    - git
    - tmux
    - Rust
  post_install:
    - scope: user
      shell: |
        set -eu
        export PATH="$HOME/.local/share/mise/shims:$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
        for tool in git cargo tmux; do
          command -v "$tool" >/dev/null 2>&1 || { echo "amux needs $tool: run 'devex install $tool' and retry." >&2; exit 1; }
        done
        checkout="$HOME/.local/share/amux"
        bin_dir="$HOME/.local/bin"
        mkdir -p "$HOME/.local/share" "$bin_dir" "$HOME/.amux/logs"
        if [ -d "$checkout/.git" ]; then
          git -C "$checkout" pull --ff-only
        else
          git clone --depth 1 https://github.com/mixpeek/amux.git "$checkout"
        fi
        tmp_target="$(mktemp -d /var/tmp/devex-amux-build.XXXXXX)"
        trap 'rm -rf "$tmp_target"' EXIT
        CARGO_TARGET_DIR="$tmp_target" CARGO_INCREMENTAL=0 cargo build --manifest-path "$checkout/Cargo.toml" --release -p amux-server -p amux-cli
        install -m 0755 "$tmp_target/release/amux-server" "$bin_dir/amux-server-rs"
        install -m 0755 "$tmp_target/release/amux-rs" "$bin_dir/amux-rs"
        if [ -f "$checkout/amux" ]; then
          install -m 0755 "$checkout/amux" "$bin_dir/amux"
        fi
        unit_dir="$HOME/.local/share/systemd/user"
        unit_file="$unit_dir/amux-server.service"
        mkdir -p "$unit_dir"
        cat <<'EOF' > "$unit_file"
        [Unit]
        Description=amux Server (Rust)
        Documentation=https://amux.io/docs/
        After=network-online.target

        [Service]
        Type=simple
        EnvironmentFile=-%h/.amux/server.env
        Environment="AMUX_RS_BIND=127.0.0.1"
        Environment="AMUX_RS_PORT=8824"
        Environment="AMUX_HOME=%h/.amux"
        WorkingDirectory=%h/.amux
        ExecStart=%h/.local/bin/amux-server-rs
        Restart=on-failure
        RestartSec=5
        KillMode=process

        [Install]
        WantedBy=default.target
        EOF
        chmod 0644 "$unit_file"
        if [ -d /run/systemd/system ] && command -v systemctl >/dev/null 2>&1 && systemctl --user daemon-reload >/dev/null 2>&1; then
          echo "Installed amux user service at $unit_file (bound to 127.0.0.1:8824, not enabled)."
          echo "Enable and start it with: systemctl --user enable --now amux-server.service"
        else
          echo "Installed amux user service file at $unit_file (bound to 127.0.0.1:8824)."
          echo "systemd user manager is unavailable here; run manually with: AMUX_RS_BIND=127.0.0.1 AMUX_RS_PORT=8824 $bin_dir/amux-server-rs"
          echo "On a systemd host, enable it with: systemctl --user enable --now amux-server.service"
        fi
  uninstall_command: |
    set -eu
    if [ -d /run/systemd/system ] && command -v systemctl >/dev/null 2>&1; then
      systemctl --user stop amux-server.service >/dev/null 2>&1 || true
      systemctl --user disable amux-server.service >/dev/null 2>&1 || true
    fi
    rm -f "$HOME/.local/share/systemd/user/amux-server.service"
    if [ -d /run/systemd/system ] && command -v systemctl >/dev/null 2>&1; then
      systemctl --user daemon-reload >/dev/null 2>&1 || true
    fi
    rm -f "$HOME/.local/bin/amux-server-rs" "$HOME/.local/bin/amux-rs" "$HOME/.local/bin/amux"
    rm -rf "$HOME/.local/share/amux"
