name: DimCode
description: ArcShips' multi-model terminal AI coding agent
category: AI Coding Agents
default: false
desktop_environments:
  - all
# Vendor docs: https://dimagent.cn/
# npm package: https://www.npmjs.com/package/dimcode
macos:
  install_method: mise
  install_command: node@lts npm:dimcode@latest
  uninstall_command: npm:dimcode
  self_updating: false
  official_support: true
  dependencies:
    - Node.js
windows:
  install_method: mise
  install_command: node@lts npm:dimcode@latest
  uninstall_command: npm:dimcode
  self_updating: false
  official_support: true
  dependencies:
    - Node.js
linux:
  # mise installs npm:dimcode without sudo npm -g. Node is installed in the same
  # mise call because the npm backend needs it.
  # Node 24, not node@lts: mise's lts is Node 26, whose Linux binaries need
  # libatomic.so.1, which fresh Debian/Ubuntu images lack (#703).
  install_method: mise
  install_command: node@24 npm:dimcode@latest
  uninstall_command: npm:dimcode
  self_updating: false
  official_support: true
  dependencies:
    - Node.js
