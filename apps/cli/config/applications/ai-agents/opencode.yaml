name: OpenCode
description: Open-source AI coding agent for the terminal
category: AI Coding Agents
default: false
desktop_environments:
  - all
macos:
  install_method: brew
  install_command: anomalyco/tap/opencode
  uninstall_command: anomalyco/tap/opencode
  brew_tap: anomalyco/tap
  self_updating: false
  official_support: true
linux:
  # Unpinned bootstrap script: OpenCode updates the installer on release and
  # publishes no checksum for the script itself. The script fetches the release
  # archive over HTTPS from github.com/anomalyco/opencode/releases into
  # $HOME/.opencode/bin/opencode (the upstream script does not verify a separate
  # binary checksum). OpenCode defaults autoupdate to true. Windows is omitted
  # until DevEx has a scoop or chocolatey plugin.
  install_method: curlpipe
  download_url: https://opencode.ai/install
  install_scope: user
  installed_binary: opencode
  # Where the install script puts the binary, so status finds it before PATH is reloaded.
  destination: ~/.opencode/bin
  self_updating: true
  uninstall_command: rm -f "$HOME/.opencode/bin/opencode"
  official_support: true
