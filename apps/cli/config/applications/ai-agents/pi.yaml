name: Pi
description: Minimal, extensible terminal AI coding agent
category: AI Coding Agents
default: false
desktop_environments:
  - all
# Vendor docs: https://github.com/earendil-works/pi
# Website: https://pi.dev/docs/latest
# Uses @earendil-works/pi-coding-agent (binary: pi); @mariozechner/pi-coding-agent
# is deprecated in favor of this package, and pi-acp is a third-party ACP adapter.
# Pi's install.sh requires Node >= 22.19 and runs npm (and prompts /dev/tty when
# Node is absent) rather than installing a native binary, so mise npm is primary.
macos:
  install_method: mise
  install_command: node@24 npm:@earendil-works/pi-coding-agent@latest
  uninstall_command: npm:@earendil-works/pi-coding-agent
  self_updating: false
  official_support: true
  dependencies:
    - Node.js
  alternatives:
    - install_method: brew
      install_command: pi-coding-agent
      uninstall_command: pi-coding-agent
      self_updating: false
      official_support: false
windows:
  install_method: mise
  install_command: node@24 npm:@earendil-works/pi-coding-agent@latest
  uninstall_command: npm:@earendil-works/pi-coding-agent
  self_updating: false
  official_support: true
  dependencies:
    - Node.js
linux:
  # mise installs npm:@earendil-works/pi-coding-agent without sudo npm -g. Node
  # is installed in the same mise call because the npm backend needs it.
  # Node 24, not node@lts: mise's lts is Node 26, whose Linux binaries need
  # libatomic.so.1, which fresh Debian/Ubuntu images lack (#703).
  install_method: mise
  install_command: node@24 npm:@earendil-works/pi-coding-agent@latest
  uninstall_command: npm:@earendil-works/pi-coding-agent
  self_updating: false
  official_support: true
  dependencies:
    - Node.js
  alternatives:
    - install_method: brew
      install_command: pi-coding-agent
      uninstall_command: pi-coding-agent
      self_updating: false
      official_support: false
