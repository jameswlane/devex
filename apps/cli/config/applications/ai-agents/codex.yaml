name: Codex CLI
description: OpenAI's local coding agent CLI
category: AI Coding Agents
default: false
desktop_environments:
  - all
macos:
  install_method: brew
  install_command: codex
  uninstall_command: codex
  brew_cask: true
  self_updating: false
  official_support: true
linux:
  # mise resolves codex from its registry to aqua:openai/codex official GitHub
  # release binaries. Windows is omitted because OpenAI's docs target Windows 11
  # via WSL2 rather than a native package manager.
  install_method: mise
  install_command: codex@latest
  uninstall_command: codex
  self_updating: false
  official_support: true
  dependencies:
    - mise
