name: Zed
description: High-performance, multiplayer code editor written in Rust with integrated AI workflows
category: AI Code Editors
default: false
desktop_environments:
  - graphical
macos:
  install_method: brew
  install_command: zed
  uninstall_command: zed
  brew_cask: true
  official_support: true
linux:
  # Unpinned bootstrap script: Zed does not publish an official APT repository,
  # .deb, AppImage, or checksum/signature for its Linux tarball or install.sh.
  # The official script installs per-user into ~/.local/zed.app, symlinks
  # ~/.local/bin/zed, and writes ~/.local/share/applications/dev.zed.Zed.desktop
  # with an absolute icon path for GNOME and KDE.
  install_method: curlpipe
  download_url: https://zed.dev/install.sh
  install_scope: user
  installed_binary: zed
  self_updating: true
  uninstall_command: rm -rf "$HOME/.local/zed.app" && rm -f "$HOME/.local/bin/zed" "$HOME/.local/share/applications/dev.zed.Zed.desktop"
  official_support: true
