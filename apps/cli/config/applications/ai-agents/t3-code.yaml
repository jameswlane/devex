# Upstream: https://github.com/pingdotgg/t3code (https://t3.codes)
name: T3 Code
description: Open-source control plane, chat UI, and local server for running coding agents across desktop, web, and mobile
category: AI Agent Harnesses
default: false
desktop_environments:
  - all
macos:
  install_method: brew
  install_command: t3-code
  uninstall_command: t3-code
  brew_cask: true
  self_updating: true
  official_support: true
windows:
  install_method: winget
  install_command: T3Tools.T3Code
  uninstall_command: T3Tools.T3Code
  self_updating: true
  official_support: true
linux:
  # Unpinned official bootstrap script: https://t3.codes/install.sh downloads
  # SHA256SUMS and the matching t3-<ver>-linux-<arch>.tar.gz from GitHub
  # Releases, verifies the archive's SHA-256, unpacks into ~/.t3/runtime/versions,
  # and writes ~/.local/bin/t3. `t3 update` keeps it current.
  # DevEx does not write or enable a service: upstream's `t3 service install`
  # owns the t3code.service user unit (localhost-only by default), and
  # `t3 uninstall` removes that service, the launcher and the downloads while
  # keeping ~/.t3/userdata and ~/.t3/service.env.
  install_method: curlpipe
  download_url: https://t3.codes/install.sh
  install_scope: user
  installed_binary: t3
  self_updating: true
  official_support: true
  post_install:
    - scope: user
      shell: |
        set -eu
        echo "T3 Code installed to $HOME/.local/bin/t3. No background service was enabled."
        echo "Run it in a terminal with: t3 (or 't3 serve' without a browser); it binds to localhost by default."
        echo "To run it as a background user service (localhost only unless you run 't3 up --lan'): t3 service install"
  uninstall_command: |
    set -eu
    if [ -x "$HOME/.local/bin/t3" ]; then
      "$HOME/.local/bin/t3" uninstall --yes
    fi
