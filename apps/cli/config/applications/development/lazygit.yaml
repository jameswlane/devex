name: LazyGit
description: A simple terminal UI for git commands
category: Development Tools
default: false
desktop_environments:
  - all
macos:
  install_method: brew
  install_command: lazygit
  uninstall_command: lazygit
  official_support: true
  alternatives:
    - install_method: macports
      install_command: lazygit
      uninstall_command: lazygit
      official_support: true
      pre_install:
        - shell: sudo port install lazygit
  system_requirements:
    git_version: '>=2.0'
    required_commands:
      - git
windows:
  install_method: winget
  install_command: JesseDuffield.lazygit
  uninstall_command: JesseDuffield.lazygit
  official_support: true
  alternatives:
    - install_method: chocolatey
      install_command: lazygit
      uninstall_command: lazygit
      official_support: true
    - install_method: scoop
      install_command: lazygit
      uninstall_command: lazygit
      official_support: true
      pre_install:
        - shell: scoop bucket add extras
  system_requirements:
    git_version: '>=2.0'
    required_commands:
      - git
linux:
  install_method: curlpipe
  installed_binary: lazygit
  download_url: https://github.com/jesseduffield/lazygit/releases/download/v0.66.3/lazygit_0.66.3_linux_x86_64.tar.gz
  destination: /usr/local/bin
  verification:
    sha256: 0a23f429a95f0d09db298b3c291536d818de066aa5a85c255806f0490ff6656b
  official_support: true
  # Upstream documents the release tarball for Debian/Ubuntu releases that do
  # not package lazygit; other distros use their alternative below, and an
  # unmatched distro falls back to this entry.
  platform_requirements:
    - os: debian
      version: <13
    - os: ubuntu
      version: <25.10
  alternatives:
    - install_method: apt
      install_command: lazygit
      uninstall_command: lazygit
      official_support: true
      platform_requirements:
        - os: debian
          version: 13+
        - os: ubuntu
          version: 25.10+
    - install_method: dnf
      install_command: lazygit
      uninstall_command: lazygit
      official_support: true
      platform_requirements:
        - os: fedora
        - os: amazonlinux
          version: 2023+
        - os: centos
          version: 9+
      pre_install:
        - scope: system
          shell: dnf copr enable -y dejan/lazygit
    - install_method: pacman
      install_command: lazygit
      uninstall_command: lazygit
      official_support: true
      platform_requirements:
        - os: arch
        - os: manjaro
    - install_method: zypper
      install_command: lazygit
      uninstall_command: lazygit
      official_support: true
      platform_requirements:
        - os: opensuse-tumbleweed
      pre_install:
        - shell: sudo zypper ar https://download.opensuse.org/repositories/devel:/languages:/go/openSUSE_Factory/devel:languages:go.repo
        - shell: sudo zypper --non-interactive --gpg-auto-import-keys ref
    - install_method: zypper
      install_command: lazygit
      uninstall_command: lazygit
      official_support: true
      platform_requirements:
        - os: opensuse-leap
      pre_install:
        - shell: source /etc/os-release && sudo zypper ar https://download.opensuse.org/repositories/devel:/languages:/go/$VERSION_ID/devel:languages:go.repo
        - shell: sudo zypper --non-interactive --gpg-auto-import-keys ref
    - install_method: emerge
      install_command: dev-vcs/lazygit
      uninstall_command: dev-vcs/lazygit
      official_support: false
      platform_requirements:
        - os: gentoo
        - os: funtoo
      pre_install:
        - shell: sudo eselect repository enable guru
        - shell: sudo emaint sync -r guru
    - install_method: xbps
      install_command: lazygit
      uninstall_command: lazygit
      official_support: true
      platform_requirements:
        - os: void
    - install_method: eopkg
      install_command: lazygit
      uninstall_command: lazygit
      official_support: true
      platform_requirements:
        - os: solus
    - install_method: nixpkgs
      install_command: lazygit
      uninstall_command: lazygit
      official_support: true
      platform_requirements:
        - os: nixos
    - install_method: apk
      install_command: lazygit
      uninstall_command: lazygit
      official_support: false
      platform_requirements:
        - os: alpine
  system_requirements:
    git_version: '>=2.0'
    required_commands:
      - git
