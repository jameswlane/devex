name: tmux
description: Terminal multiplexer used by coding agent harnesses to manage background sessions
category: Dependency
default: false
desktop_environments:
  - all
macos:
  install_method: brew
  install_command: tmux
  uninstall_command: tmux
  official_support: true
linux:
  install_method: apt
  install_command: tmux
  uninstall_command: tmux
  official_support: true
  platform_requirements:
    - os: debian
    - os: ubuntu
  alternatives:
    - install_method: dnf
      install_command: tmux
      uninstall_command: tmux
      official_support: true
      platform_requirements:
        - os: fedora
        - os: centos
        - os: rhel
    - install_method: pacman
      install_command: tmux
      uninstall_command: tmux
      official_support: true
      platform_requirements:
        - os: arch
        - os: manjaro
    - install_method: zypper
      install_command: tmux
      uninstall_command: tmux
      official_support: true
      platform_requirements:
        - os: opensuse
        - os: opensuse-tumbleweed
        - os: opensuse-leap
        - os: suse
