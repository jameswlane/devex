name: zstd
description: Fast lossless compression utility used for extracting .tar.zst archives
category: Dependency
default: false
desktop_environments:
  - all
linux:
  install_method: apt
  install_command: zstd
  uninstall_command: zstd
  official_support: true
  platform_requirements:
    - os: debian
    - os: ubuntu
  alternatives:
    - install_method: dnf
      install_command: zstd
      uninstall_command: zstd
      official_support: true
      platform_requirements:
        - os: fedora
        - os: centos
        - os: rhel
    - install_method: pacman
      install_command: zstd
      uninstall_command: zstd
      official_support: true
      platform_requirements:
        - os: arch
        - os: manjaro
    - install_method: zypper
      install_command: zstd
      uninstall_command: zstd
      official_support: true
      platform_requirements:
        - os: opensuse
        - os: opensuse-tumbleweed
        - os: opensuse-leap
        - os: suse
