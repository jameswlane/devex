name: curl
description: A tool to transfer data from or to a server
category: Dependency
default: false
desktop_environments:
  - all
linux:
  install_method: apt
  install_command: curl
  uninstall_command: curl
  official_support: true
  platform_requirements:
    - os: debian
    - os: ubuntu
  alternatives:
    - install_method: dnf
      install_command: curl
      uninstall_command: curl
      # RHEL and CentOS ship curl-minimal, which conflicts with the full curl
      # package; an existing curl executable satisfies the dependency.
      installed_binary: curl
      official_support: true
      platform_requirements:
        - os: fedora
        - os: centos
        - os: rhel
    - install_method: pacman
      install_command: curl
      uninstall_command: curl
      official_support: true
      platform_requirements:
        - os: arch
        - os: manjaro
    - install_method: zypper
      install_command: curl
      uninstall_command: curl
      official_support: true
      platform_requirements:
        - os: opensuse
        - os: opensuse-tumbleweed
        - os: opensuse-leap
        - os: suse
