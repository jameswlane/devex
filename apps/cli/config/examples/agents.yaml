# Example declarative coding-agent configuration for DevEx.
# Copy to ~/.config/devex/config/agents.yaml (or $DEVEX_CONFIG_DIR/config/agents.yaml),
# validate with `devex config validate`, preview with `devex agent diff`,
# and render with `devex agent apply`.
agents:
  enabled:
    - claude
    - codex
    - gemini
    - opencode
  # Conservative permission preset: strict | balanced (omit to leave permission modes untouched).
  preset: balanced
  # Shared global instructions rendered into each installed agent's instructions file
  # inside a DevEx-managed block while keeping all user text outside the block.
  instructions: |
    Prefer small, focused diffs.
    Run the relevant test suite before finishing a task.
  # Shell command prefixes allowed without confirmation (merged with user entries).
  allowed_commands:
    - "git status"
    - "git diff"
    - "go test ./..."
  # Shell command prefixes explicitly denied.
  denied_commands:
    - "git push --force"
  # Per-agent overrides: model, preset, and additional allowed/denied commands.
  overrides:
    claude:
      model: claude-sonnet-5
      preset: strict
      allowed_commands:
        - "gh pr view"
    codex:
      model: gpt-5
    gemini:
      model: gemini-2.5-pro
    opencode:
      model: anthropic/claude-sonnet-5-5
  # MCP servers rendered into every target agent's native MCP configuration.
  # Secrets must use environment variable references (${env:VAR_NAME}); literal
  # tokens are rejected and keyring lookups are not supported in v1.
  mcp_servers:
    - name: github
      transport: http
      url: https://api.githubcopilot.com/mcp/
      headers:
        Authorization: "Bearer ${env:GITHUB_TOKEN}"
      # Optional subset of agents.enabled; omit to target all enabled agents.
      agents: [claude, codex]
    - name: filesystem
      transport: stdio
      command: npx
      args: ["-y", "@modelcontextprotocol/server-filesystem", "/home/me/src"]
      env:
        GITHUB_TOKEN: "${env:GITHUB_TOKEN}"
  # Register DevEx's own read-only MCP server (`devex mcp serve`) under "devex".
  devex_mcp: true
  # Optional Ollama models to preview with `devex agent diff` / `apply --dry-run`
  # and pull with `devex agent apply` (requires Ollama installed via `devex install ollama`).
  local_models:
    - qwen2.5-coder:7b
    - llama3.2:3b
