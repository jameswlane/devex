# Full-Stack Template Applications Configuration
# Template Version: 1.4.0
applications:
  # Core Development Tools
  - name: git
    category: development
    description: Distributed version control system
    default: true
    install_method: apt
    install_command: git
  - name: curl
    category: development
    description: Command line tool for transferring data
    default: true
    install_method: apt
    install_command: curl
  - name: wget
    category: development
    description: Network downloader
    default: true
    install_method: apt
    install_command: wget
  # Code Editors
  # Resolve Visual Studio Code and its platform-specific setup from the application catalog.
  - name: Visual Studio Code
  # Containerization
  # Resolve Docker and its platform-specific setup from the application catalog.
  - name: docker
  # Database Systems
  - name: postgresql
    category: database
    description: PostgreSQL database server
    default: true
    install_method: apt
    install_command: postgresql postgresql-contrib
  - name: redis
    category: database
    description: In-memory data structure store
    default: true
    install_method: apt
    install_command: redis-server
  # Web Browsers
  # Resolve Google Chrome and its platform-specific setup from the application catalog.
  - name: Google Chrome
  # Resolve Firefox Developer Edition and its platform-specific setup from the application catalog.
  - name: Firefox Developer Edition
