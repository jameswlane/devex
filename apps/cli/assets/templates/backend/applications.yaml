# Backend Template Applications Configuration
# Template Version: 1.2.0
applications:
  # Core Development Tools
  - name: git
    category: development
    description: Distributed version control system
    default: true
    install_method: apt
    install_command: git
  - name: curl
    category: development
    description: Command line tool for transferring data
    default: true
    install_method: apt
    install_command: curl
  - name: jq
    category: development
    description: Command-line JSON processor
    default: true
    install_method: apt
    install_command: jq
  # Containerization & Orchestration
  # Resolve Docker and its platform-specific setup from the application catalog.
  - name: docker
  - name: kubectl
    category: container
    description: Kubernetes command-line tool
    default: true
    install_method: mise
    install_command: kubectl@1.37
  - name: helm
    category: container
    description: Kubernetes package manager
    default: true
    install_method: mise
    install_command: helm@4
  # Database Systems
  - name: postgresql
    category: database
    description: PostgreSQL database server
    default: true
    install_method: apt
    install_command: postgresql postgresql-contrib
  - name: redis
    category: database
    description: In-memory data structure store
    default: true
    install_method: apt
    install_command: redis-server
  # Message Queues
  - name: rabbitmq
    category: infrastructure
    description: Message broker
    default: true
    install_method: apt
    install_command: rabbitmq-server
  # Monitoring & Observability
  - name: htop
    category: system
    description: Interactive process viewer
    default: true
    install_method: apt
    install_command: htop
  - name: netstat
    category: system
    description: Network statistics tool
    default: true
    install_method: apt
    install_command: net-tools
