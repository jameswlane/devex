schema_version: devex.template/v1
id: mobile
name: Mobile Development
version: 1.0.0
description: React Native, Flutter, Android and iOS prerequisites with explicit platform guards
author: DevEx Team
tags:
  - mobile
  - react-native
  - flutter
  - android
  - ios
categories:
  - mobile
metadata:
  init_profile: true
  languages:
    - node
    - java
  platforms:
    - linux
    - macos
  limitations:
    - iOS needs macOS. On Linux the ios target installs nothing.
    - Xcode is never installed. Install it from the App Store yourself.
    - After installing Xcode, run sudo xcodebuild -license accept and xcode-select --install.
    - Android SDK and emulator setup happens in the Android Studio first-run wizard, which needs a desktop session.
    - Accept the Android SDK licenses in that wizard or with sdkmanager --licenses.
    - React Native and Flutter Android builds need the android target too. iOS builds need the ios target on macOS.
    - The macOS steps use Homebrew, which must already be installed.
inputs:
  targets:
    type: multiselect
    prompt: Mobile toolchains to prepare
    required: true
    options:
      - label: React Native (Node.js and a JDK)
        value: react-native
      - label: Flutter SDK
        value: flutter
      - label: Android (JDK and Android Studio)
        value: android
      - label: iOS (CocoaPods, macOS only)
        value: ios
  node_version:
    type: text
    prompt: Node.js version for React Native (mise version prefix)
    default: "24"
    validation: &version
      pattern: ^[0-9A-Za-z][0-9A-Za-z.+_-]*$
      message: Versions may contain only letters, numbers, dots, plus signs, underscores, and hyphens.
  java_version:
    type: text
    prompt: JDK for Android builds (mise java version)
    default: temurin-17
    validation: *version
  flutter_version:
    type: text
    prompt: Flutter SDK version (mise version prefix)
    default: "3.50"
    validation: *version
lifecycle:
  install:
    - id: mise
      order: 10
      description: Install mise, which pins Node.js, the JDK and Flutter
      if: |-
        contains(inputs.targets, "react-native") || contains(inputs.targets, "flutter")
        || contains(inputs.targets, "android")
      plugin:
        name: package-manager-mise
        command: ensure-installed
    - id: node
      order: 20
      depends_on:
        - mise
      if: contains(inputs.targets, "react-native")
      app:
        name: Node.js
        category: mobile
        installer: mise
        command: install
        args:
          - node@{{ inputs.node_version }}
      resources:
        - type: tool
          name: node
          external_id: node@{{ inputs.node_version }}
          metadata:
            tool: node
    - id: java
      order: 30
      depends_on:
        - mise
      if: contains(inputs.targets, "react-native") || contains(inputs.targets, "android")
      app:
        name: Java JDK
        category: mobile
        installer: mise
        command: install
        args:
          - java@{{ inputs.java_version }}
      resources:
        - type: tool
          name: java
          external_id: java@{{ inputs.java_version }}
          metadata:
            tool: java
    - id: flutter
      order: 40
      depends_on:
        - mise
      if: contains(inputs.targets, "flutter")
      app:
        name: Flutter
        category: mobile
        installer: mise
        command: install
        args:
          - flutter@{{ inputs.flutter_version }}
      resources:
        - type: tool
          name: flutter
          external_id: flutter@{{ inputs.flutter_version }}
          metadata:
            tool: flutter
    - id: flatpak
      order: 50
      description: Install Flatpak and add Flathub for Android Studio
      if: contains(inputs.targets, "android") && platform("linux")
      plugin:
        name: package-manager-flatpak
        command: ensure-installed
    - id: flathub
      order: 60
      depends_on:
        - flatpak
      if: contains(inputs.targets, "android") && platform("linux")
      plugin:
        name: package-manager-flatpak
        command: add-flathub
    - id: android-studio-linux
      order: 70
      depends_on:
        - flathub
      if: contains(inputs.targets, "android") && platform("linux")
      app:
        name: Android Studio
        category: mobile
        installer: flatpak
        command: install
        args:
          - com.google.AndroidStudio
      resources:
        - type: package
          name: android-studio
          external_id: com.google.AndroidStudio
          metadata:
            installer: flatpak
    - id: android-studio-macos
      order: 70
      if: contains(inputs.targets, "android") && platform("darwin")
      app:
        name: Android Studio
        category: mobile
        installer: brew
        command: install
        args:
          - --cask
          - android-studio
      resources:
        - type: package
          name: android-studio
          external_id: android-studio
          metadata:
            installer: brew
            selector: --cask
    - id: cocoapods
      order: 80
      if: contains(inputs.targets, "ios") && platform("darwin")
      app:
        name: CocoaPods
        category: mobile
        installer: brew
        command: install
        args:
          - --formula
          - cocoapods
      resources:
        - type: package
          name: cocoapods
          external_id: cocoapods
          metadata:
            installer: brew
            selector: --formula
  maintain:
    - id: node-update
      order: 10
      if: has_resource("node")
      plugin:
        name: package-manager-mise
        command: install
        args:
          - "{{ resource.node.external_id }}"
    - id: java-update
      order: 20
      if: has_resource("java")
      plugin:
        name: package-manager-mise
        command: install
        args:
          - "{{ resource.java.external_id }}"
    - id: flutter-update
      order: 30
      if: has_resource("flutter")
      plugin:
        name: package-manager-mise
        command: install
        args:
          - "{{ resource.flutter.external_id }}"
    - id: android-studio-macos-upgrade
      order: 40
      if: has_resource("android-studio-macos")
      plugin:
        name: package-manager-brew
        command: upgrade
        args:
          - --cask
          - "{{ resource.android-studio-macos.external_id }}"
    - id: cocoapods-upgrade
      order: 50
      if: has_resource("cocoapods")
      plugin:
        name: package-manager-brew
        command: upgrade
        args:
          - --formula
          - "{{ resource.cocoapods.external_id }}"
  status:
    - id: node-status
      order: 10
      if: has_resource("node")
      plugin:
        name: package-manager-mise
        command: is-installed
        args:
          - "{{ resource.node.external_id }}"
    - id: java-status
      order: 20
      if: has_resource("java")
      plugin:
        name: package-manager-mise
        command: is-installed
        args:
          - "{{ resource.java.external_id }}"
    - id: flutter-status
      order: 30
      if: has_resource("flutter")
      plugin:
        name: package-manager-mise
        command: is-installed
        args:
          - "{{ resource.flutter.external_id }}"
    - id: android-studio-linux-status
      order: 40
      if: has_resource("android-studio-linux")
      plugin:
        name: package-manager-flatpak
        command: is-installed
        args:
          - "{{ resource.android-studio-linux.external_id }}"
    - id: android-studio-macos-status
      order: 50
      if: has_resource("android-studio-macos")
      plugin:
        name: package-manager-brew
        command: is-installed
        args:
          - --cask
          - "{{ resource.android-studio-macos.external_id }}"
    - id: cocoapods-status
      order: 60
      if: has_resource("cocoapods")
      plugin:
        name: package-manager-brew
        command: is-installed
        args:
          - --formula
          - "{{ resource.cocoapods.external_id }}"
  remove:
    - id: cocoapods-remove
      order: 10
      if: has_resource("cocoapods")
      plugin:
        name: package-manager-brew
        command: remove
        args:
          - --formula
          - "{{ resource.cocoapods.external_id }}"
    - id: android-studio-macos-remove
      order: 20
      if: has_resource("android-studio-macos")
      plugin:
        name: package-manager-brew
        command: remove
        args:
          - --cask
          - "{{ resource.android-studio-macos.external_id }}"
    - id: android-studio-linux-remove
      order: 30
      if: has_resource("android-studio-linux")
      plugin:
        name: package-manager-flatpak
        command: remove
        args:
          - "{{ resource.android-studio-linux.external_id }}"
    - id: flutter-remove
      order: 40
      if: has_resource("flutter")
      plugin:
        name: package-manager-mise
        command: remove
        args:
          - "{{ resource.flutter.external_id }}"
    - id: java-remove
      order: 50
      if: has_resource("java")
      plugin:
        name: package-manager-mise
        command: remove
        args:
          - "{{ resource.java.external_id }}"
    - id: node-remove
      order: 60
      if: has_resource("node")
      plugin:
        name: package-manager-mise
        command: remove
        args:
          - "{{ resource.node.external_id }}"
