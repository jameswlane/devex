schema_version: devex.template/v1
id: web-development
name: Web Development
version: 2.0.0
description: Node.js through mise for React, Vue, Angular and other JavaScript web development
author: DevEx Team
tags:
  - web
  - frontend
  - react
  - vue
  - angular
  - javascript
  - typescript
categories:
  - development
metadata:
  languages:
    - node
  platforms:
    - linux
    - macos
  limitations:
    - VS Code and Google Chrome are not installed. They need vendor package repositories, so install them yourself.
inputs:
  node_version:
    type: text
    prompt: Node.js version (mise version prefix)
    default: "24"
    validation:
      pattern: ^[0-9A-Za-z][0-9A-Za-z.+_-]*$
      message: Versions may contain only letters, numbers, dots, plus signs, underscores, and hyphens.
lifecycle:
  install:
    - id: mise
      order: 10
      description: Install mise, which pins Node.js
      plugin:
        name: package-manager-mise
        command: ensure-installed
    - id: node
      order: 20
      depends_on:
        - mise
      app:
        name: Node.js
        category: development
        installer: mise
        command: install
        args:
          - node@{{ inputs.node_version }}
      resources:
        - type: tool
          name: node
          external_id: node@{{ inputs.node_version }}
          metadata:
            tool: node
  maintain:
    # Re-running `mise use` moves Node.js to the newest release that matches
    # the version prefix recorded at install time.
    - id: node-update
      order: 10
      if: has_resource("node")
      plugin:
        name: package-manager-mise
        command: install
        args:
          - "{{ resource.node.external_id }}"
  status:
    - id: node-status
      order: 10
      if: has_resource("node")
      plugin:
        name: package-manager-mise
        command: is-installed
        args:
          - "{{ resource.node.metadata.tool }}"
  remove:
    - id: node-remove
      order: 10
      if: has_resource("node")
      plugin:
        name: package-manager-mise
        command: remove
        args:
          - "{{ resource.node.external_id }}"
