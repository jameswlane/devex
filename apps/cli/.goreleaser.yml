# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
version: 2
project_name: devex
# CLI tags are plain vX.Y.Z; the prefix keeps previous-tag and changelog detection
# from crossing into packages/*/vX.Y.Z plugin tags. Paths below are relative to dir.
monorepo:
  tag_prefix: v
  dir: apps/cli
metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
builds:
  - id: devex
    main: ./cmd/main.go
    binary: bin/devex
    # Pure-Go SQLite (modernc.org/sqlite): every target is a static, CGO-free build.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
archives:
  - id: devex
    ids: [devex]
    # apps/get/public/install and install.ps1 expect tar.gz on every OS.
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - assets/**/*
      - config/**/*
      - help/*
report_sizes: true
checksum:
  name_template: devex_checksums.txt
  algorithm: sha256
signs:
  - id: cosign
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
snapshot:
  version_template: "{{ incpatch .Version }}-next"
release:
  github:
    owner: jameswlane
    name: devex
  name_template: "devex v{{ .Version }}"
  target_commitish: "{{ .Commit }}"
  prerelease: auto
  # The CLI is the only component that may become GitHub's "Latest" release.
  make_latest: true
  include_meta: true
  preflight:
    fail_on_error: true
  header: |
    ## DevEx {{ .Tag }} ({{ .Date }})
changelog:
  use: github
  sort: asc
  format: "{{ .SHA }}: {{ .Message }}{{ with .AuthorUsername }} (@{{ . }}){{ end }}"
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "(?i)typo"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]-]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]-]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
verify:
  commands:
    - cmd: sha256sum
      args: ["--ignore-missing", "-c", "devex_checksums.txt"]
    - cmd: cosign
      args:
        - verify-blob
        - --bundle=devex_checksums.txt.sigstore.json
        - --certificate-identity-regexp=^https://github\.com/jameswlane/devex/\.github/workflows/
        - --certificate-oidc-issuer=https://token.actions.githubusercontent.com
        - devex_checksums.txt
  retry:
    attempts: 5
    delay: 10s
