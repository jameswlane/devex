version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/apps/cli"
      - "/packages/*"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
