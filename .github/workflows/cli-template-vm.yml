name: CLI template VM
# Installs each built-in template on a clean KVM virtual machine and checks the
# result from a new login. Jobs use the released plugins, so the weekly run also
# catches plugin and upstream package changes that break a template.
on:
  schedule:
    - cron: '17 6 * * 0'
  pull_request:
    paths:
      - 'apps/cli/assets/templates/**'
      - 'apps/cli/scripts/e2e-template-vm.sh'
      - 'apps/cli/scripts/lib/vm.sh'
      - 'apps/cli/test/vm/guest/template-check.sh'
      - '.github/workflows/cli-template-vm.yml'
  workflow_dispatch:
    inputs:
      distro:
        description: 'Distribution to test'
        required: false
        type: choice
        options: [all, ubuntu-24.04, debian-12]
        default: all
      template:
        description: 'Template ID to test (empty for all)'
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: cli-template-vm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  list:
    name: List templates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      templates: ${{ steps.list.outputs.templates }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up development tools
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: List built-in templates
        id: list
        working-directory: apps/cli
        env:
          TEMPLATE_INPUT: ${{ inputs.template }}
        run: |
          ./scripts/e2e-template-vm.sh --list > templates.txt
          if [ -n "$TEMPLATE_INPUT" ]; then
            grep -Fx -- "$TEMPLATE_INPUT" templates.txt > selected.txt ||
              { echo "::error::unknown template: $TEMPLATE_INPUT"; exit 1; }
            mv selected.txt templates.txt
          fi
          echo "templates=$(jq -Rsc 'split("\n") | map(select(length > 0))' templates.txt)" >> "$GITHUB_OUTPUT"
  vm:
    name: ${{ matrix.distro }} / ${{ matrix.template }}
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON((inputs.distro == '' || inputs.distro == 'all') && '["ubuntu-24.04", "debian-12"]' || format('["{0}"]', inputs.distro)) }}
        template: ${{ fromJSON(needs.list.outputs.templates) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up development tools
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable KVM and install QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils
      - name: Install and verify the template
        working-directory: apps/cli
        env:
          DISTRO: ${{ matrix.distro }}
          TEMPLATE: ${{ matrix.template }}
          VM_CACHE_DIR: ${{ runner.temp }}/devex-vm
          VM_CPUS: '4'
          VM_MEMORY: '8192'
        run: ./scripts/e2e-template-vm.sh
      - name: Upload VM artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cli-template-vm-${{ matrix.distro }}-${{ matrix.template }}
          path: ./apps/cli/artifacts/vm-templates/**
          if-no-files-found: warn
      - name: Publish check summary
        if: always()
        working-directory: apps/cli
        env:
          DISTRO: ${{ matrix.distro }}
          TEMPLATE: ${{ matrix.template }}
        run: |
          log="artifacts/vm-templates/$DISTRO-$TEMPLATE/verify.log"
          {
            echo "## $DISTRO / $TEMPLATE"
            if [ -f "$log" ]; then
              echo "- Passed: $(grep -c '^\[pass\]' "$log" || true)"
              echo "- Failed: $(grep -c '^\[FAIL\]' "$log" || true)"
              echo "- Known issues: $(grep -c '^\[known\]' "$log" || true)"
              grep '^\[known\]' "$log" | sed 's/^/  - /' || true
              grep '^\[FAIL\]' "$log" | sed 's/^/  - /' || true
            else
              echo "The install step failed before verification; see install.log in the artifacts."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
