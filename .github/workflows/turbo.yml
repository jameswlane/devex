name: Turbo task regression tests
on:
  push:
    branches: [main]
    paths:
      - 'turbo.json'
      - '.mise.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'biome.json'
      - 'apps/**'
      - 'packages/**'
      - 'scripts/turbo/**'
      - '.github/workflows/turbo.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'turbo.json'
      - '.mise.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'biome.json'
      - 'apps/**'
      - 'packages/**'
      - 'scripts/turbo/**'
      - '.github/workflows/turbo.yml'
      - '.github/workflows/ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo:test
