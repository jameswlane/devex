name: Plugin Taskfiles
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/plugin-taskfiles.yml'
  pull_request:
    paths:
      - 'packages/**'
      - '.github/workflows/plugin-taskfiles.yml'
permissions:
  contents: read
jobs:
  validate:
    name: Dry-run every plugin build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate plugin Taskfiles
        run: |
          for taskfile in packages/*/Taskfile.yml; do
            plugin_dir=$(dirname "$taskfile")
            if [ -f "$plugin_dir/main.go" ]; then
              echo "::group::$plugin_dir"
              (cd "$plugin_dir" && mise exec task@3.54.0 -- task --dry build)
              echo "::endgroup::"
            fi
          done
