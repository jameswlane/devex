name: CI
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.changes.outputs.cli }}
      sdk: ${{ steps.changes.outputs.sdk }}
      plugins: ${{ steps.changes.outputs.plugins }}
      web: ${{ steps.changes.outputs.web }}
      registry: ${{ steps.changes.outputs.registry }}
      docs: ${{ steps.changes.outputs.docs }}
      plugin-matrix: ${{ steps.plugins.outputs.matrix }}
      has-changes: ${{ steps.changes.outputs.cli == 'true' || steps.changes.outputs.sdk == 'true' || steps.changes.outputs.plugins == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect path changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            cli:
              - 'apps/cli/**'
            sdk:
              - 'packages/plugin-sdk/**'
            plugins:
              - 'packages/**'
              - '!packages/plugin-sdk/**'
            web:
              - 'apps/web/**'
            registry:
              - 'apps/registry/**'
            docs:
              - 'apps/docs/**'

      - name: Detect changed plugins
        if: steps.changes.outputs.plugins == 'true'
        id: plugins
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # For PRs, compare against the base branch
            changed_files=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD)
          else
            # For pushes, compare against the previous commit
            changed_files=$(git diff --name-only HEAD~1 HEAD)
          fi

          changed_plugins=()

          for file in $changed_files; do
            if [[ $file == packages/* ]]; then
              plugin_dir=$(echo $file | cut -d'/' -f2)
              # Skip plugin-sdk and ensure plugin has main.go or package.json
              if [ "$plugin_dir" != "plugin-sdk" ] && \
                 ([ -f "packages/$plugin_dir/main.go" ] || [ -f "packages/$plugin_dir/package.json" ]); then
                if [[ ! " ${changed_plugins[@]} " =~ " $plugin_dir " ]]; then
                  changed_plugins+=("$plugin_dir")
                fi
              fi
            fi
          done

          # Convert to JSON array for matrix
          if [ ${#changed_plugins[@]} -gt 0 ]; then
            plugins_json=$(printf '%s\n' "${changed_plugins[@]}" | jq -R . | jq -s -c .)
            echo "matrix=$plugins_json" >> $GITHUB_OUTPUT
            echo "Changed plugins: ${changed_plugins[*]}"
          else
            echo "matrix=[]" >> $GITHUB_OUTPUT
            echo "No plugins changed"
          fi

  test-cli:
    name: Test CLI
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.cli == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache TurboRepo builds
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-cli-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-cli-

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install

      - name: Lint CLI
        run: pnpm turbo lint --filter=@devex/cli --concurrency=1

      - name: Vulnerability check (CLI)
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f  # v1.1.0
        with:
          go-version-file: apps/cli/go.mod
          go-package: ./...
          work-dir: apps/cli

      - name: Build CLI
        run: pnpm turbo build --filter=@devex/cli

      - name: Test CLI
        run: pnpm turbo test --filter=@devex/cli

  test-sdk:
    name: Test Plugin SDK
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.sdk == 'true'
    defaults:
      run:
        working-directory: packages/plugin-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          go mod download
          go install github.com/onsi/ginkgo/v2/ginkgo@latest

      - name: Lint SDK
        run: golangci-lint run

      - name: Vulnerability check (Plugin SDK)
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f  # v1.1.0
        with:
          go-version-file: packages/plugin-sdk/go.mod
          go-package: ./...
          work-dir: packages/plugin-sdk

      - name: Build SDK
        run: go build ./...

      - name: Test SDK
        run: |
          echo "Running comprehensive Plugin SDK tests with Ginkgo..."
          ginkgo run -v --randomize-all --fail-on-pending . || go test -v ./...

      - name: Verify SDK can be imported
        run: |
          echo "Verifying SDK can be imported as a Go module..."
          cd /tmp
          go mod init test-import
          cat > main.go << 'EOF'
          package main
          import (
              "fmt"
              "github.com/jameswlane/devex/packages/plugin-sdk"
          )
          func main() {
              info := sdk.PluginInfo{
                  Name: "test-plugin",
                  Version: "1.0.0",
              }
              fmt.Printf("Plugin: %s v%s\n", info.Name, info.Version)
          }
          EOF
          go build . || echo "SDK import test failed - this is expected for unreleased versions"

  test-plugins:
    name: Test Plugins
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.plugins == 'true' && needs.detect-changes.outputs.plugin-matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.detect-changes.outputs.plugin-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test plugin ${{ matrix.plugin }}
        run: |
          cd packages/${{ matrix.plugin }}

          echo "::group::Updating dependencies for ${{ matrix.plugin }}"
          if [ -f "go.mod" ]; then
            go mod tidy
            go mod download
          fi
          echo "::endgroup::"

          echo "::group::Linting ${{ matrix.plugin }}"
          if [ -f "go.mod" ]; then
            golangci-lint run || echo "Linting failed for ${{ matrix.plugin }}"
          fi
          echo "::endgroup::"

          echo "::group::Building ${{ matrix.plugin }}"
          if [ -f "main.go" ]; then
            go build -v -o devex-plugin-${{ matrix.plugin }} .
            echo "::endgroup::"

            echo "::group::Testing plugin functionality"
            ./devex-plugin-${{ matrix.plugin }} --plugin-info || echo "Plugin info command not available"
            echo "::endgroup::"
          elif [ -f "package.json" ]; then
            echo "Node.js plugin detected"
            if command -v npm &> /dev/null; then
              npm install || echo "npm install failed"
              npm test || echo "npm test failed"
            fi
            echo "::endgroup::"
          fi

          echo "::group::Running tests"
          if [ -f "go.mod" ] && ls *_test.go >/dev/null 2>&1; then
            go test -v ./...
          else
            echo "No tests found for ${{ matrix.plugin }}"
          fi
          echo "::endgroup::"

  test-js:
    name: Test JS
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true' || needs.detect-changes.outputs.registry == 'true' || needs.detect-changes.outputs.docs == 'true'
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/devex
      PRISMA_DATABASE_URL: postgresql://ci:ci@localhost:5432/devex
      KV_REST_API_URL: http://localhost:8080
      KV_REST_API_TOKEN: ci-dummy-token
      KV_URL: redis://localhost:6379
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check (web)
        if: needs.detect-changes.outputs.web == 'true'
        run: pnpm exec biome check apps/web

      - name: Biome check (docs)
        if: needs.detect-changes.outputs.docs == 'true'
        run: pnpm exec biome check apps/docs

      - name: Biome check (registry)
        if: needs.detect-changes.outputs.registry == 'true'
        run: pnpm exec biome check apps/registry

      - name: Generate Prisma client (registry)
        if: needs.detect-changes.outputs.registry == 'true'
        run: pnpm --filter @devex/registry run db:generate

      - name: Typecheck web
        if: needs.detect-changes.outputs.web == 'true'
        run: pnpm --filter @devex/web exec tsc --noEmit

      - name: Typecheck docs
        if: needs.detect-changes.outputs.docs == 'true'
        run: pnpm --filter @devex/docs exec tsc --noEmit

      - name: Typecheck registry
        if: needs.detect-changes.outputs.registry == 'true'
        run: pnpm --filter @devex/registry exec tsc --noEmit

      - name: Test web
        if: needs.detect-changes.outputs.web == 'true'
        run: pnpm --filter @devex/web test

      - name: Test registry
        if: needs.detect-changes.outputs.registry == 'true'
        run: pnpm --filter @devex/registry test

      - name: Build web
        if: needs.detect-changes.outputs.web == 'true'
        run: pnpm --filter @devex/web build

      - name: Build docs
        if: needs.detect-changes.outputs.docs == 'true'
        run: pnpm --filter @devex/docs build

      - name: Build registry
        if: needs.detect-changes.outputs.registry == 'true'
        run: pnpm --filter @devex/registry build
