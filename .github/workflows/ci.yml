name: CI
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/ci/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/ci/**'
      - '.github/workflows/ci.yml'
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.changes.outputs.cli }}
      sdk: ${{ steps.changes.outputs.sdk }}
      plugins: ${{ steps.changes.outputs.plugins }}
      web: ${{ steps.changes.outputs.web }}
      registry: ${{ steps.changes.outputs.registry }}
      docs: ${{ steps.changes.outputs.docs }}
      plugin-matrix: ${{ steps.plugins.outputs.matrix }}
      has-changes: ${{ steps.changes.outputs.cli == 'true' || steps.changes.outputs.sdk == 'true' || steps.changes.outputs.plugins == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect path changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            cli:
              - 'apps/cli/**'
              # The CLI builds against the local SDK through a replace directive.
              - 'packages/plugin-sdk/**'
            sdk:
              - 'packages/plugin-sdk/**'
              - 'scripts/ci/**'
              - '.github/workflows/ci.yml'
            plugins:
              - 'packages/**'
              - '!packages/plugin-sdk/**'
            web:
              - 'apps/web/**'
            registry:
              - 'apps/registry/**'
            docs:
              - 'apps/docs/**'
      - name: Test plugin matrix selection
        if: steps.changes.outputs.sdk == 'true'
        run: node --test scripts/ci/*.test.mjs
      - name: Detect changed plugins
        if: steps.changes.outputs.plugins == 'true' || steps.changes.outputs.sdk == 'true'
        id: plugins
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # For PRs, compare against the base branch
            changed_files=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD)
          else
            # For pushes, compare against the previous commit
            changed_files=$(git diff --name-only HEAD~1 HEAD)
          fi

          # Shared SDK changes select every recorder adopter (any plugin whose
          # tests import sdktest); see scripts/ci/plugin-matrix.mjs.
          plugins_json=$(printf '%s\n' "$changed_files" | node scripts/ci/plugin-matrix.mjs --sdk "${{ steps.changes.outputs.sdk }}")
          echo "matrix=$plugins_json" >> "$GITHUB_OUTPUT"
          {
            echo "### Plugin test matrix"
            echo "SDK changed: ${{ steps.changes.outputs.sdk }}"
            echo '```json'
            echo "$plugins_json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Selected plugins: $plugins_json"
  test-cli:
    name: Test CLI
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.cli == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache TurboRepo builds
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-cli-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-cli-
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: pnpm install
      - name: Lint CLI
        run: pnpm turbo lint --filter=@devex/cli --concurrency=1
      - name: Vulnerability check (CLI)
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        env:
          # mise exports GOROOT for its Go; the action installs its own Go,
          # and a stale GOROOT makes the two toolchains collide.
          GOROOT: ""
        with:
          go-version-input: "1.26.10"
          repo-checkout: false
          go-package: ./...
          work-dir: apps/cli
      - name: Build CLI
        run: pnpm turbo build --filter=@devex/cli
      - name: Test CLI
        run: pnpm turbo test --filter=@devex/cli
  test-sdk:
    name: Test Plugin SDK
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.sdk == 'true'
    defaults:
      run:
        working-directory: packages/plugin-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: |
          go mod download
      - name: Lint SDK
        run: golangci-lint run
      - name: Vulnerability check (Plugin SDK)
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        env:
          # mise exports GOROOT for its Go; the action installs its own Go,
          # and a stale GOROOT makes the two toolchains collide.
          GOROOT: ""
        with:
          go-version-input: "1.26.10"
          repo-checkout: false
          go-package: ./...
          work-dir: packages/plugin-sdk
      - name: Build SDK
        run: go build ./...
      - name: Test SDK
        run: |
          echo "Running comprehensive Plugin SDK tests with Ginkgo..."
          go run github.com/onsi/ginkgo/v2/ginkgo run -r -v --randomize-all --fail-on-pending .
      - name: Verify SDK can be imported
        run: |
          echo "Verifying SDK can be imported as a Go module..."
          cd /tmp
          go mod init test-import
          cat > main.go << 'EOF'
          package main
          import (
              "fmt"
              "github.com/jameswlane/devex/packages/plugin-sdk"
          )
          func main() {
              info := sdk.PluginInfo{
                  Name: "test-plugin",
                  Version: "1.0.0",
              }
              fmt.Printf("Plugin: %s v%s\n", info.Name, info.Version)
          }
          EOF
          go build . || echo "SDK import test failed - this is expected for unreleased versions"
  test-plugins:
    name: Test Plugins
    runs-on: ubuntu-latest
    needs: detect-changes
    if: (needs.detect-changes.outputs.plugins == 'true' || needs.detect-changes.outputs.sdk == 'true') && needs.detect-changes.outputs.plugin-matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.detect-changes.outputs.plugin-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test plugin ${{ matrix.plugin }}
        env:
          # Pass the matrix value as data, never as script text.
          PLUGIN_NAME: ${{ matrix.plugin }}
        run: bash scripts/ci/test-plugin.sh "$PLUGIN_NAME"
  test-js:
    name: Test JS
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true' || needs.detect-changes.outputs.registry == 'true' || needs.detect-changes.outputs.docs == 'true'
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/devex
      PRISMA_DATABASE_URL: postgresql://ci:ci@localhost:5432/devex
      KV_REST_API_URL: http://localhost:8080
      KV_REST_API_TOKEN: ci-dummy-token
      KV_URL: redis://localhost:6379
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Biome check (web)
        if: needs.detect-changes.outputs.web == 'true'
        run: pnpm exec biome check apps/web
      - name: Biome check (docs)
        if: needs.detect-changes.outputs.docs == 'true'
        run: pnpm exec biome check apps/docs
      - name: Biome check (registry)
        if: needs.detect-changes.outputs.registry == 'true'
        run: pnpm exec biome check apps/registry
      - name: Generate Prisma client (registry)
        if: needs.detect-changes.outputs.registry == 'true'
        run: pnpm --filter @devex/registry run db:generate
      - name: Typecheck web
        if: needs.detect-changes.outputs.web == 'true'
        run: pnpm --filter @devex/web exec tsc --noEmit
      - name: Typecheck docs
        if: needs.detect-changes.outputs.docs == 'true'
        run: pnpm --filter @devex/docs exec tsc --noEmit
      - name: Typecheck registry
        if: needs.detect-changes.outputs.registry == 'true'
        run: pnpm --filter @devex/registry exec tsc --noEmit
      - name: Test web
        if: needs.detect-changes.outputs.web == 'true'
        run: pnpm --filter @devex/web test
      - name: Test registry
        if: needs.detect-changes.outputs.registry == 'true'
        run: pnpm --filter @devex/registry test
      - name: Build web
        if: needs.detect-changes.outputs.web == 'true'
        run: pnpm --filter @devex/web build
      - name: Build docs
        if: needs.detect-changes.outputs.docs == 'true'
        run: pnpm --filter @devex/docs build
      - name: Build registry
        if: needs.detect-changes.outputs.registry == 'true'
        run: pnpm --filter @devex/registry build
