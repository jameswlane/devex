name: goreleaser
on:
  push:
    tags: ['v*', 'packages/*/v*']
  # Re-run a release for an existing tag (e.g. a run that failed).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.0.5 or packages/package-manager-apt/v0.0.2'
        required: true
        type: string
  # Called by other workflows that create tags with GITHUB_TOKEN, since those
  # tag pushes do not trigger this workflow on their own.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      GORELEASER_KEY:
        required: true
      # Signs the release webhook; without it the registry sync workflow is dispatched instead.
      REGISTRY_RELEASE_WEBHOOK_SECRET:
        required: false
permissions:
  contents: read
concurrency:
  # One release at a time per component; never cancel a release midway.
  group: goreleaser-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub release and upload assets
      id-token: write  # keyless cosign signing
      actions: write  # dispatch the registry sync fallback
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      name: ${{ steps.component.outputs.name }}
      version: ${{ steps.component.outputs.version }}
      plugin: ${{ steps.component.outputs.plugin }}
    steps:
      - name: Resolve component
        id: component
        run: |
          case "$TAG" in
            packages/*/v*)
              name="${TAG#packages/}"
              name="${name%%/v*}"
              config="packages/${name}/.goreleaser.yml"
              plugin=true
              [ "$name" = "plugin-sdk" ] && plugin=false
              ;;
            v[0-9]*)
              name="cli"
              config="apps/cli/.goreleaser.yml"
              plugin=false
              ;;
            *)
              echo "::error::Unrecognised tag '$TAG'; expected vX.Y.Z or packages/<name>/vX.Y.Z"
              exit 1
              ;;
          esac
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "version=${TAG##*/v}" >> "$GITHUB_OUTPUT"
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "Releasing $name from $config"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - name: Check config exists
        run: test -f "${{ steps.component.outputs.config }}" || { echo "::error::Missing ${{ steps.component.outputs.config }}"; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de  # v7.3.0
        with:
          distribution: goreleaser-pro
          version: v2.19.0
          args: release --clean -f ${{ steps.component.outputs.config }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
      # Pushes the release straight into the registry. A failure here never fails the
      # release: the next step falls back to the registry sync workflow.
      - name: Notify the plugin registry
        id: notify
        if: steps.component.outputs.plugin == 'true'
        continue-on-error: true
        env:
          REGISTRY_RELEASE_WEBHOOK_SECRET: ${{ secrets.REGISTRY_RELEASE_WEBHOOK_SECRET }}
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
        run: |
          # Installed next to the script so the pnpm workspace is not installed.
          npm install --prefix scripts/release --no-save --no-package-lock --ignore-scripts js-yaml@4.1.1
          node scripts/release/notify-registry.mjs --dist dist --tag "$TAG"
      # workflow_dispatch is one of the few events GITHUB_TOKEN is allowed to trigger.
      - name: Fall back to the registry sync workflow
        if: steps.component.outputs.plugin == 'true' && steps.notify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::warning::Release webhook to the registry failed for $TAG; dispatching sync-registry-database.yml instead"
          gh workflow run sync-registry-database.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"
  smoke:
    # Smoke-tests the published plugin release (release-smoke.yml).
    needs: release
    if: needs.release.outputs.plugin == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/release-smoke.yml
    with:
      plugin: ${{ needs.release.outputs.name }}
      version: ${{ needs.release.outputs.version }}
